[package]
name = "outlook-mapi-http"
version = "0.1.0"
description = "Clean-room MAPI over HTTP (MS-OXCMAPIHTTP) client for Exchange mailboxes"

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Windows only: check local MAPI constants against outlook-mapi-sys at compile time.
# Only the constant and type definitions are used; MAPI is never loaded or logged on.
mapi-sys = [ "dep:outlook-mapi-sys" ]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = [ "blocking", "cookies", "native-tls" ] }
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
outlook-mapi-sys = { workspace = true, optional = true }
